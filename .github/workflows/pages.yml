name: Deploy web build to Pages

# Turns the web build into something you can actually open. The CI artifact is
# a folder of static files, and Flutter web cannot run from file:// because it
# fetches its assets and modules over HTTP, so it has to be served.
#
# One-time setup: repository Settings, Pages, and set Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; skip queued ones rather than cancel a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # base-href matters: Pages serves a project site from /<repo>/, and
      # without this every asset request would go to the domain root and 404.
      #
      # --no-web-resources-cdn bundles CanvasKit rather than fetching it from a
      # Google CDN at runtime, so the page has no third-party dependency.
      - name: Build web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
