name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The engine is plain Dart, so it runs without the Flutter tooling.
      - name: Engine tests
        working-directory: engine
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      # Golden tests are excluded: they render through the local graphics stack
      # and their bytes differ between machines, so they belong on a developer's
      # screen rather than in a gate. Run them with `flutter test --tags golden`.
      - name: App analysis and tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test --exclude-tags golden

  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Debug-signed on purpose: it installs on any phone with "unknown
      # sources" enabled, with no keystore to manage. Swap to `--release` plus
      # a signing config when you are ready for the Play Store.
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: minedoku-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  web:
    name: Build web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --no-web-resources-cdn bundles CanvasKit with the build instead of
      # fetching it from a Google CDN at runtime.
      - name: Build web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        with:
          name: minedoku-web
          path: app/build/web
          if-no-files-found: error
