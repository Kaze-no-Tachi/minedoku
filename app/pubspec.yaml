name: minedoku
description: "Minedoku - a grid logic puzzle: one mine per row, column and colour, and none may touch."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # The puzzle rules, solver, generator and hints. Pure Dart, no Flutter, so it
  # can be unit-tested on its own with `dart test`.
  minedoku_engine:
    path: ../engine
  # Saves progress and settings on the device.
  shared_preferences: ^2.2.0
  # Plays the generated sound effects.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generate every platform icon and splash size from one source image.
  # Build-time only: neither ships in the app.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    # Generated by tool/build_sounds.dart, not hand-authored audio.
    - assets/sounds/

# Source images are produced by test/app_icon_test.dart, so the icon is a build
# artifact drawn from the same glyph as the board rather than a binary nobody
# can edit. Regenerate with:
#   flutter test test/app_icon_test.dart --update-goldens
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#6B3FE0"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#6B3FE0"
    theme_color: "#6B3FE0"

flutter_native_splash:
  color: "#F7F5FA"
  color_dark: "#14121F"
  image: "assets/icon/app_icon_foreground.png"
  android_12:
    image: "assets/icon/app_icon_foreground.png"
    color: "#F7F5FA"
    color_dark: "#14121F"
